; =====================================================================
; ESH LMS - per-directory PHP settings for the cPanel domain
; ---------------------------------------------------------------------
; Honoured by PHP-FPM and the CGI/FastCGI SAPIs, which is how cPanel's
; ea-phpXX builds normally run. mod_php ignores this file; on such a host
; set the same values in cPanel > MultiPHP INI Editor.
;
;   upload_max_filesize / post_max_size
;     Materials and submissions validate at max:102400 (100 MB), so both
;     limits must allow 100 MB or large uploads fail with a validation
;     error instead of a PHP "file too large" notice.
;
;   session.upload_progress.enabled=0
;     The feature is unused by this app (Laravel's own file session driver
;     is in use) and it is a known attack surface; PHP's own advisory
;     recommends leaving it off.
;
; PHP caches user_ini files for user_ini.cache_ttl (300s by default).
; =====================================================================

upload_max_filesize=100M
post_max_size=104M
memory_limit=256M
max_execution_time=300

session.upload_progress.enabled=0
