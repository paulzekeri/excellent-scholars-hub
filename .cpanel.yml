---
# Fallback deploy path: cPanel → Git™ Version Control → "Deploy HEAD Commit".
#
# The primary pipeline is the GitHub Actions workflow
# (.github/workflows/deploy-cpanel.yml), which publishes on every push to main.
# Use this file only when the repository is cloned through cPanel's own Git
# Version Control, which runs the tasks below after pulling.
#
# Both produce the SAME layout: the whole app lives in the subdomain's document
# root and the repository's root .htaccess forwards requests into public/.
deployment:
  tasks:
    # App folder = the document root of uat-esh.lit-grp.com on this account.
    - export APP_PATH=/home/litgrpco/uat-esh.lit-grp.com
    # PHP 8.1 from EasyApache; falls back to the account default binary.
    - export PHP_BIN=/opt/cpanel/ea-php81/root/usr/bin/php
    - test -x $PHP_BIN || export PHP_BIN=/usr/local/bin/php
    - /bin/mkdir -p $APP_PATH
    # Application code only: .env, storage/ uploads and vendor/ stay untouched.
    - /bin/cp -R app bootstrap config database public resources routes $APP_PATH
    - /bin/cp artisan composer.json composer.lock .htaccess .user.ini $APP_PATH
    - cd $APP_PATH && composer install --no-dev --optimize-autoloader --no-interaction
    - cd $APP_PATH && $PHP_BIN artisan migrate --force --seed
    - cd $APP_PATH && $PHP_BIN artisan storage:link
    - cd $APP_PATH && $PHP_BIN artisan config:cache
    - cd $APP_PATH && $PHP_BIN artisan view:cache
    - cd $APP_PATH && $PHP_BIN artisan esh:health
